<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Lời chúc Ngày Nhà giáo Việt Nam 20/11</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Be+Vietnam+Pro:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #e8eee9;
            --ink: #1d2b26;
            --muted: #4f625a;
            --panel: #f6f9f6;
            --line: #c5d2ca;
            --red: #b3202a;
            --red-ink: #fff;
            --gold: #8a6a12;
            --board: #1f3d35;
            --board2: #16302a;
            --chalk: #f3f1e7;
            --chalk-dim: #c9d3c8;
            --wood: #8a5a36;
            --wood2: #6b4226;
            --ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
            --hand: "Mali", "Comic Sans MS", "Segoe Print", cursive;
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1714;
                --ink: #e9f0ea;
                --muted: #a7b8ae;
                --panel: #17221e;
                --line: #2c3d36;
                --red: #e2535c;
                --red-ink: #1a0a0b;
                --gold: #e0bf5a;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f1714;
            --ink: #e9f0ea;
            --muted: #a7b8ae;
            --panel: #17221e;
            --line: #2c3d36;
            --red: #e2535c;
            --red-ink: #1a0a0b;
            --gold: #e0bf5a;
            color-scheme: dark
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--ui);
            line-height: 1.6;
            min-height: 100vh
        }

        canvas#petals {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 860px;
            margin: 0 auto;
            padding: 28px 16px 40px
        }

        .top {
            text-align: center;
            margin-bottom: 18px
        }

        .top p {
            margin: 0;
            color: var(--muted);
            font-size: .95rem
        }

        .top h1 {
            margin: 2px 0 0;
            font-family: var(--hand);
            font-weight: 700;
            font-size: clamp(1.5rem, 5vw, 2.1rem);
            letter-spacing: .01em
        }

        /* Chalkboard */
        .frame {
            background: linear-gradient(145deg, var(--wood), var(--wood2));
            padding: 14px;
            border-radius: 10px;
            box-shadow: 0 14px 30px rgba(0, 0, 0, .28)
        }

        .board {
            position: relative;
            background: radial-gradient(120% 90% at 30% 10%, var(--board), var(--board2));
            border-radius: 4px;
            padding: clamp(20px, 5vw, 44px);
            color: var(--chalk);
            font-family: var(--hand);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, .45);
            min-height: 430px
        }

        .board::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 4px;
            pointer-events: none;
            background: repeating-linear-gradient(115deg, rgba(255, 255, 255, .025) 0 2px, transparent 2px 9px)
        }

        .date {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px
        }

        .date b {
            font-size: clamp(3rem, 13vw, 5.4rem);
            line-height: 1;
            font-weight: 700;
            color: var(--chalk);
            transform: rotate(-3deg);
            text-shadow: 0 0 1px #fff
        }

        .date span {
            font-size: clamp(1rem, 3.4vw, 1.25rem);
            color: var(--chalk-dim);
            max-width: 16ch;
            line-height: 1.35
        }

        .flower {
            width: clamp(54px, 12vw, 86px);
            height: auto;
            margin-left: auto;
            opacity: .95
        }

        .stage {
            display: flex;
            align-items: flex-end;
            gap: 6px
        }

        .letter {
            flex: 1;
            min-width: 0;
            max-width: 60ch
        }

        .teacher {
            flex: none;
            width: clamp(190px, 34vw, 280px);
            height: auto;
            overflow: visible;
            margin-right: -8px
        }

        .point {
            animation: tap 1.8s ease-in-out infinite
        }

        @keyframes tap {

            0%,
            100% {
                transform: rotate(0)
            }

            45% {
                transform: rotate(5deg)
            }

            60% {
                transform: rotate(-3deg)
            }
        }

        .letter p {
            margin: 0 0 .85em;
            font-size: clamp(1rem, 2.9vw, 1.2rem);
            line-height: 1.75
        }

        .letter .to {
            font-weight: 700;
            font-size: clamp(1.15rem, 3.4vw, 1.4rem)
        }

        .letter .sign {
            text-align: right;
            margin-top: 1.1em;
            max-width: none
        }

        .letter .sign em {
            display: block;
            font-style: normal;
            color: #f2c9cc
        }

        .line {
            opacity: 0;
            clip-path: inset(0 0 100% 0);
            animation: write .9s ease-out forwards;
            animation-delay: var(--d, 0s)
        }

        @keyframes write {
            to {
                opacity: 1;
                clip-path: inset(0 0 0 0)
            }
        }

        .tray {
            height: 14px;
            margin: 0 -4px;
            background: linear-gradient(var(--wood), var(--wood2));
            border-radius: 0 0 8px 8px;
            position: relative
        }

        .tray i {
            position: absolute;
            top: -6px;
            height: 6px;
            border-radius: 2px 2px 0 0;
            background: #efe9d8
        }

        .tray i:nth-child(1) {
            left: 8%;
            width: 46px
        }

        .tray i:nth-child(2) {
            left: 8%;
            margin-left: 56px;
            width: 18px;
            background: #f2c9cc
        }

        /* Controls */
        .panel {
            margin-top: 26px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 20px
        }

        .panel h2 {
            margin: 0 0 4px;
            font-size: 1.05rem
        }

        .panel .hint {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: .9rem
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        label {
            display: block;
            font-size: .85rem;
            font-weight: 500;
            margin-bottom: 4px
        }

        input[type=text] {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--ink);
            font: inherit
        }

        input[type=text]:focus-visible,
        button:focus-visible,
        .tab:focus-visible {
            outline: 3px solid var(--gold);
            outline-offset: 2px
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 16px 0
        }

        .tab {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            padding: 9px 14px;
            border-radius: 6px;
            font: inherit;
            font-size: .9rem;
            cursor: pointer
        }

        .tab[aria-pressed="true"] {
            background: var(--ink);
            color: var(--bg);
            border-color: var(--ink)
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center
        }

        .btn {
            border: 0;
            background: var(--red);
            color: var(--red-ink);
            padding: 12px 22px;
            border-radius: 6px;
            font: inherit;
            font-weight: 600;
            cursor: pointer
        }

        .btn.ghost {
            background: transparent;
            color: var(--ink);
            border: 1px solid var(--line);
            font-weight: 500
        }

        .status {
            font-size: .88rem;
            color: var(--muted);
            min-height: 1.4em
        }

        .proverb {
            margin: 30px auto 0;
            text-align: center;
            max-width: 46ch;
            font-family: var(--hand);
            color: var(--muted);
            font-size: 1.05rem
        }

        .proverb small {
            display: block;
            margin-top: 6px;
            font-family: var(--ui);
            font-size: .82rem
        }

        @media (max-width:560px) {
            .grid {
                grid-template-columns: 1fr
            }

            .date {
                flex-wrap: wrap
            }

            .board {
                min-height: 0
            }

            .stage {
                flex-direction: column;
                align-items: stretch
            }

            .teacher {
                align-self: flex-end;
                width: 200px
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .line {
                animation: none;
                opacity: 1;
                clip-path: none
            }

            .point {
                animation: none
            }
        }
    </style>
</head>

<body>
    <canvas id="petals" aria-hidden="true"></canvas>
    <main>
        <header class="top">
            <h1>Ngày Nhà giáo Việt Nam</h1>
        </header>

        <section aria-label="Bảng lời chúc">
            <div class="frame">
                <div class="board">
                    <div class="date">
                        <b>Dear<br>Thanh Vân</b>

                        <svg class="flower" viewBox="0 0 100 130" fill="none" stroke="#f3f1e7" stroke-width="2.2"
                            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M50 124C50 100 48 86 50 66" />
                            <path
                                d="M50 104c-14-2-22-10-24-22 14 0 22 8 24 22zM50 92c12-2 20-9 22-20-13 0-21 7-22 20z" />
                            <g stroke="#f2c9cc">
                                <path d="M50 66c-9-3-16-12-14-24 6 4 11 6 14 10 3-4 8-6 14-10 2 12-5 21-14 24z" />
                                <path d="M50 52c-6-6-7-14-4-24 4 4 6 7 4 10 2-3 4-6 4-10 3 10 2 18-4 24z" />
                                <path d="M50 52c0-8 0-14 0-22" />
                            </g>
                        </svg>
                    </div>
                    <div class="stage">
                        <div class="letter" id="letter" aria-live="polite"></div>
                        <svg class="teacher" viewBox="-70 -10 190 210" aria-hidden="true">
                            <ellipse cx="60" cy="196" rx="38" ry="5" fill="rgba(0,0,0,.25)" />
                            <rect x="45" y="170" width="10" height="22" fill="#34404a" />
                            <rect x="63" y="170" width="10" height="22" fill="#34404a" />
                            <ellipse cx="48" cy="193" rx="8" ry="4" fill="#b3202a" />
                            <ellipse cx="70" cy="193" rx="8" ry="4" fill="#b3202a" />
                            <path d="M41 118 L77 118 L74 182 L61 182 L59 138 L57 182 L44 182 Z" fill="#34404a" />
                            <path d="M42 68 Q59 62 76 68 L80 124 Q59 130 38 124 Z" fill="#f6f1e4" />
                            <path d="M59 82 L59 126" stroke="#d3d1c4" stroke-width="1.2" />
                            <path d="M47 65 Q59 74 71 65 L69 80 Q59 86 49 80 Z" fill="#3b3230" />
                            <path d="M62 78 L73 87 L64 91 Z" fill="#3b3230" />
                            <circle cx="53" cy="72" r="1.1" fill="#d8c9a8" />
                            <circle cx="59" cy="76" r="1.1" fill="#d8c9a8" />
                            <circle cx="65" cy="72" r="1.1" fill="#d8c9a8" />
                            <circle cx="56" cy="81" r="1.1" fill="#d8c9a8" />
                            <circle cx="64" cy="82" r="1.1" fill="#d8c9a8" />
                            <circle cx="68" cy="86" r="1" fill="#d8c9a8" />
                            <path
                                d="M40 38 Q40 14 59 14 Q78 14 78 38 L81 90 Q76 98 70 93 L68 60 L50 60 L48 93 Q42 98 37 90 Z"
                                fill="#3a2620" />
                            <rect x="54" y="56" width="10" height="10" fill="#f2c9a5" />
                            <circle cx="59" cy="40" r="17" fill="#f2c9a5" />
                            <path d="M41 42 Q38 14 59 15 Q80 14 77 42 Q72 26 62 24 Q52 32 41 42 Z" fill="#3a2620" />

                            <circle cx="52" cy="42" r="1.7" fill="#2a1a17" />
                            <circle cx="66" cy="42" r="1.7" fill="#2a1a17" />
                            <circle cx="48" cy="47" r="3" fill="#f0a3a0" opacity=".6" />
                            <circle cx="70" cy="47" r="3" fill="#f0a3a0" opacity=".6" />
                            <path d="M52 48 Q59 57 66 48 Z" fill="#fff" stroke="#b3202a" stroke-width="1.6"
                                stroke-linejoin="round" />
                            <path d="M76 72 Q92 96 86 120" fill="none" stroke="#f6f1e4" stroke-width="9"
                                stroke-linecap="round" />
                            <rect x="84" y="112" width="20" height="26" rx="2" fill="#b3202a"
                                transform="rotate(-8 94 125)" />
                            <circle cx="86" cy="122" r="4.5" fill="#f2c9a5" />
                            <g transform="translate(44 74)">
                                <g class="point">
                                    <path d="M0 0 Q-16 12 -30 -2" fill="none" stroke="#f6f1e4" stroke-width="9"
                                        stroke-linecap="round" />
                                    <path d="M-32 -3 L-96 -48" stroke="#e0b44c" stroke-width="3"
                                        stroke-linecap="round" />
                                    <circle cx="-31" cy="-3" r="4.5" fill="#f2c9a5" />
                                </g>
                            </g>
                        </svg>
                    </div>
                </div>
                <div class="tray" aria-hidden="true"><i></i><i></i></div>
            </div>
        </section>

        <p class="proverb">“Một chữ cũng là thầy, nửa chữ cũng là thầy.”<small></small></p>
    </main>

    <script>
        (function () {
            var lines = [
                "Nhân ngày 20/11, chúc cậu có một ngày thật vui và ý nghĩa nhé.",
                "Chúc cậu luôn giữ được sự nhiệt huyết với công việc gia sư, học tập thật tốt và sớm trở thành một bác sĩ giỏi trong tương lai.",
                "Mong rằng những điều tốt đẹp cậu dành cho mọi người cũng sẽ quay trở lại với cậu.",
                "Và hy vọng những ngày sắp tới, cậu sẽ luôn có thật nhiều niềm vui, có người quan tâm, sẻ chia và khiến cậu mỉm cười nhiều hơn nhé 😊"
            ];
            var el = document.getElementById('letter');
            function render() {
                el.textContent = '';
                lines.forEach(function (text, i) {
                    var p = document.createElement('p');
                    p.className = 'line';
                    p.style.setProperty('--d', (i * 0.9) + 's');
                    p.textContent = text;
                    el.appendChild(p);
                });
            }
            /* Falling petals */
            var cv = document.getElementById('petals'), cx = cv.getContext('2d'), W, H, ps = [];
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            function size() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
            function petal(y) { return { x: Math.random() * W, y: y, r: 5 + Math.random() * 7, vy: .5 + Math.random() * 1.1, vx: -.3 + Math.random() * .6, a: Math.random() * 6.28, va: (Math.random() - .5) * .03, c: Math.random() < .6 ? 'rgba(226,83,92,.55)' : 'rgba(242,201,204,.7)' }; }
            function burst() { if (reduce) return; for (var i = 0; i < 40; i++) ps.push(petal(-10 - Math.random() * H * .4)); }
            function tick() {
                cx.clearRect(0, 0, W, H);
                for (var i = ps.length - 1; i >= 0; i--) {
                    var p = ps[i]; p.y += p.vy; p.x += p.vx + Math.sin(p.y / 40) * .4; p.a += p.va;
                    if (p.y > H + 20) { if (i >= 30) ps.splice(i, 1); else { p.y = -10; p.x = Math.random() * W; } continue; }
                    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillStyle = p.c;
                    cx.beginPath(); cx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.28); cx.fill(); cx.restore();
                }
                requestAnimationFrame(tick);
            }
            size(); addEventListener('resize', size);
            if (!reduce) { for (var k = 0; k < 30; k++) ps.push(petal(Math.random() * innerHeight)); tick(); }

            render();
        })();
    </script>
</body>

</html>
